*==============================================================================
*
*   sqldta_site_example.cfg
*   An example of the settings file of the Stata command sqldta
*
*==============================================================================
*
*   This file is only an example. sqldta never reads it under this name: it
*   reads its settings from a file named sqldta_site.cfg. net install puts
*   this example with the programs of sqldta, and adoupdate replaces it with
*   each new version, so do not edit it here. Copy it, and edit the copy.
*
*   Where to put the copy
*
*     Type  findfile sqldta_site_example.cfg  in Stata to see where this
*     file is.
*
*     For a site: copy it, as sqldta_site.cfg, into a folder that every
*     user's Stata searches for programs, such as the SITE folder or a shared
*     PERSONAL folder. Type  sysdir  in Stata to see those folders.
*
*     For one user: copy it, as sqldta_site.cfg, into the folder where this
*     file is, or into your PERSONAL folder.
*
*   How to write a setting
*
*     One setting per line: its name, some spaces, then its value.
*     Lines that start with * are comments, and sqldta ignores them.
*     To switch a setting off, put a * at the start of its line.
*
*   How sqldta uses this file
*
*     sqldta reads the file every time it runs, so a change takes effect at
*     the next command. A global macro of the same name, typed in Stata,
*     overrides a line for the rest of that Stata session.
*
*   To check the file
*
*     Type  sqldta settings  in Stata. It shows which file it read, each
*     setting, where it came from, and whether each connection line works.
*
*==============================================================================


*------------------------------------------------------------------------------
*   SQLDTA_SERVERS
*
*   The SQL Servers that users load data from, separated by spaces.
*   The first is used when a command does not say which server.
*   The dialog lists all of them.
*------------------------------------------------------------------------------

SQLDTA_SERVERS       MYSERVER


*------------------------------------------------------------------------------
*   SQLDTA_CONNECTION
*
*   How Stata connects to a server. Each line is an ODBC connection string,
*   in which sqldta replaces %server% with the server's name.
*
*   Give one line for each ODBC driver that your machines might have, the
*   best first. The first time sqldta connects to a server, it tries the lines
*   in order and keeps the first that works, until Stata is closed or
*   clear all is typed. If that is not the first line, it shows a note,
*   because the machine is using an older driver. If no line works, it uses
*   the ODBC data source that has the server's name, if the machine has one.
*
*   With only one line, sqldta uses it without trying it first, and a line
*   that does not work stops the command with the driver's message.
*
*   ODBC Driver 18 needs TrustServerCertificate=yes, unless the server has a
*   certificate that your machines trust. The last three drivers are no
*   longer supported by Microsoft, and are here for machines that have
*   nothing newer.
*------------------------------------------------------------------------------

SQLDTA_CONNECTION    Driver={ODBC Driver 18 for SQL Server};Server=%server%;Trusted_Connection=yes;TrustServerCertificate=yes;
SQLDTA_CONNECTION    Driver={ODBC Driver 17 for SQL Server};Server=%server%;Trusted_Connection=yes;
SQLDTA_CONNECTION    Driver={ODBC Driver 13 for SQL Server};Server=%server%;Trusted_Connection=yes;
SQLDTA_CONNECTION    Driver={SQL Server Native Client 11.0};Server=%server%;Trusted_Connection=yes;
SQLDTA_CONNECTION    Driver={SQL Server};Server=%server%;Trusted_Connection=yes;


*------------------------------------------------------------------------------
*   SQLDTA_DATASCHEMA
*
*   The schema of a table that a command names without one. With dbo,
*   dataset(MyTable) means dbo.MyTable. Without this line: dbo.
*------------------------------------------------------------------------------

SQLDTA_DATASCHEMA    dbo


*------------------------------------------------------------------------------
*   SQLDTA_LABELTABLE
*
*   The table that holds the labels and notes, written as schema.table. sqldta
*   looks for it in the same database as the data. Without this line:
*   ref.DataProperties.
*------------------------------------------------------------------------------

SQLDTA_LABELTABLE    ref.DataProperties


*------------------------------------------------------------------------------
*   SQLDTA_DATABASES                                          (dialog only)
*
*   The databases that the dialog lists, separated by spaces. Without this
*   line, the dialog lists every database on the server that the user can
*   open. Remove the * to use it.
*------------------------------------------------------------------------------

* SQLDTA_DATABASES   MyDatabase MyArchive


*------------------------------------------------------------------------------
*   SQLDTA_DEFAULTDB                                          (dialog only)
*
*   The database that the dialog selects when it opens, or when the user
*   changes the server. Write a database name to use it on every server, or
*   server=database to use it on one server only. Where both kinds name a
*   server, server=database is used. The example selects MyDatabase on every
*   server except MYSERVER2, where it selects MyArchive. Without this line,
*   the dialog selects the first database in its list. Remove the * to use
*   it.
*------------------------------------------------------------------------------

* SQLDTA_DEFAULTDB   MyDatabase MYSERVER2=MyArchive


*------------------------------------------------------------------------------
*   SQLDTA_DLGREMEMBER                                        (dialog only)
*
*   1: the dialog opens again at the server, database and schema that the
*      user chose last, until Stata is closed or clear all is typed.
*   0: the dialog opens at the first server, and at the database that
*      SQLDTA_DEFAULTDB names for it, every time.
*------------------------------------------------------------------------------

SQLDTA_DLGREMEMBER   0


*------------------------------------------------------------------------------
*   SQLDTA_DTTEXT
*
*   Leave this at 0. Set it to 1 only if date-time columns ever load wrongly:
*   sqldta then reads them as text and converts them in Stata, which is
*   slower but gives the same values.
*------------------------------------------------------------------------------

SQLDTA_DTTEXT        0
